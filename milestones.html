<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milestones — PureTalk</title>
<link rel="stylesheet" href="css/globals.css" />
<link rel="stylesheet" href="css/navbar.css" />
<link rel="stylesheet" href="css/footer.css" />
<link rel="stylesheet" href="css/pages.css" />
<script>
  (function(){try{var t=localStorage.getItem('puretalk-theme')||'dark';document.documentElement.classList.remove('dark','light');document.documentElement.classList.add(t);}catch(e){document.documentElement.classList.add('dark');}})();
</script>
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
<div class="page-wrap">
  <div class="ambient-glow" style="top:8%;left:-10%;width:500px;height:500px;background:radial-gradient(circle, rgba(59,130,246,0.10) 0%, transparent 70%);"></div>
  <div class="ambient-glow" style="top:40%;right:-10%;width:400px;height:400px;background:radial-gradient(circle, rgba(167,139,250,0.08) 0%, transparent 70%);"></div>
  <div class="ambient-glow" style="bottom:15%;left:35%;width:350px;height:350px;background:radial-gradient(circle, rgba(52,211,153,0.07) 0%, transparent 70%);"></div>

  <section class="section-relative" style="padding: 80px 0 60px;">
    <div class="container">
      <div class="reveal">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="width:32px;height:2px;background:linear-gradient(90deg,#3B82F6,#A78BFA);border-radius:2px;"></div>
          <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(90deg,#60A5FA,#C4B5FD);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Project Timeline</p>
        </div>
        <h1 class="section-title" style="font-size:clamp(2.5rem,5vw,4rem);margin-bottom:20px;line-height:1.15;">
          Research <span class="text-gradient">Milestones</span>
        </h1>
        <p style="max-width:640px;line-height:1.75;font-size:17px;color:var(--text-body);">
          A structured timeline tracking the progress of the PureTalk research project from initial proposal through to final presentation.
        </p>
      </div>

      <div class="reveal" data-delay="200">
        <div id="progress-indicators" style="display:flex;gap:24px;margin-top:40px;flex-wrap:wrap;padding:20px 24px;background:var(--bg-card-subtle);border:1px solid var(--border-subtle);border-radius:16px;"></div>
      </div>
    </div>
  </section>

  <section class="section-relative" style="padding: 0 0 100px;">
    <div class="container">
      <div class="timeline-container">
        <div class="timeline-center-line"></div>
        <div id="timeline-list"></div>
      </div>
    </div>
  </section>
</div>
</main>

<div id="footer-placeholder"></div>

<script src="js/theme.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/scroll-reveal.js"></script>
<script src="js/milestones.js"></script>
</body>
</html>
